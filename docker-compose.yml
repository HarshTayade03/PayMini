services:
  postgres:
    image: postgres:16-alpine
    container_name: paymini_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet_password_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-wallet_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallet_user} -d ${POSTGRES_DB:-wallet_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paymini_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_PORT: 8000
      POSTGRES_USER: ${POSTGRES_USER:-wallet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet_password_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-wallet_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wallet_user}:${POSTGRES_PASSWORD:-wallet_password_local_dev}@postgres:5432/${POSTGRES_DB:-wallet_db}
      SECRET_KEY: ${SECRET_KEY:-change_this_to_a_random_32_character_secret_key_in_production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      STARTING_BALANCE_PAISE: ${STARTING_BALANCE_PAISE:-50000}
      TOPUP_MAX_PER_REQUEST_PAISE: ${TOPUP_MAX_PER_REQUEST_PAISE:-100000}
      TOPUP_MAX_DAILY_PAISE: ${TOPUP_MAX_DAILY_PAISE:-500000}
      TRANSFER_MAX_PER_TX_PAISE: ${TRANSFER_MAX_PER_TX_PAISE:-200000}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-INR}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paymini_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-PayMini Demo Wallet}
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
